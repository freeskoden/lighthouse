name: Multi-Platform Standalone Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    name: Windows 64-bit Build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r client/requirements.txt -r server/requirements.txt
          python -m pip install nuitka

      - name: Compile Server (Nuitka with Icon)
        run: |
          python -m nuitka --standalone --onefile --windows-icon-from-ico=packaging/windows/icon.ico --assume-yes-for-downloads server/server.py

      - name: Compile Client (Nuitka with Icon)
        run: |
          python -m nuitka --standalone --onefile --windows-disable-console --enable-plugin=tk-inter --windows-icon-from-ico=packaging/windows/icon.ico --assume-yes-for-downloads client/app.py

      - name: Rename Binaries to Final Names
        run: |
          mv server.exe "Lighthouse Server.exe"
          mv app.exe Lighthouse.exe

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: Windows-64bit-Binaries
          path: |
            Lighthouse Server.exe
            Lighthouse.exe

  build-macos-intel:
    name: macOS Intel 64-bit Build
    runs-on: macos-13 # Using macOS 13 which runs on Intel x86_64 hardware
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r client/requirements.txt -r server/requirements.txt
          python -m pip install nuitka

      - name: Compile Server (Nuitka Standalone)
        run: |
          python -m nuitka --standalone server/server.py

      - name: Compile Client (Nuitka App Bundle with Icon)
        run: |
          python -m nuitka --standalone --macos-create-app-bundle --macos-app-icon=packaging/macos/icon.icns client/app.py

      - name: Rename macOS Bundles and Inject Metadata
        run: |
          # Rename Client App Bundle to 'Lighthouse.app'
          mv app.app Lighthouse.app
          # Inject Info.plist
          cp packaging/macos/Info.plist Lighthouse.app/Contents/Info.plist
          
          # Rename Server binary to 'Lighthouse Server'
          mv server.dist "Lighthouse Server.dist"
          mv "Lighthouse Server.dist/server" "Lighthouse Server.dist/Lighthouse Server"

      - name: Compress Outputs
        run: |
          zip -r Lighthouse_Server_macOS_Intel.zip "Lighthouse Server.dist/"
          zip -r Lighthouse_Client_macOS_Intel.zip Lighthouse.app/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-Binaries
          path: |
            Lighthouse_Server_macOS_Intel.zip
            Lighthouse_Client_macOS_Intel.zip

  build-linux:
    name: Linux x86_64 Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux Build Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential dpkg alien rpm wget

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r client/requirements.txt -r server/requirements.txt
          python -m pip install nuitka

      - name: Compile Server (Nuitka Standalone)
        run: |
          python -m nuitka --standalone server/server.py

      - name: Compile Client (Nuitka Standalone)
        run: |
          python -m nuitka --standalone client/app.py

      - name: Make Scripts Executable
        run: |
          chmod +x packaging/linux/build_appimage.sh
          chmod +x packaging/linux/build_deb_rpm.sh

      - name: Build AppImage Package
        run: |
          ./packaging/linux/build_appimage.sh

      - name: Build DEB and RPM Packages
        run: |
          ./packaging/linux/build_deb_rpm.sh

      - name: Upload Linux Portable Packages
        uses: actions/upload-artifact@v4
        with:
          name: Linux-x86_64-Packages
          path: |
            Lighthouse-x86_64.AppImage
            freeskoden-lighthouse_1.0.0_amd64.deb
            freeskoden-lighthouse*.rpm
